<!DOCTYPE html>

<body>

  <div id="app" class="app">

    <!-- SIDEBAR -->

      <div class="sidebar-header">

        <p>Management System</p>
      </div>

      <nav class="sidebar-nav">

        <button class="nav-item active">
          <span>⌂</span>
          <span>Dashboard</span>
        </button>

        <button class="nav-item">
          <span>👥</span>
          <span>Students</span>
        </button>

        <button class="nav-item">
          <span>💰</span>
          <span>Fund Collection</span>
        </button>


        <button class="nav-item">
          <span>📅</span>
          <span>Events</span>
        </button>


      </nav>

      <div class="sidebar-footer">

        <button class="nav-item">
          <span>⚙</span>
          <span>Settings</span>
        </button>

        <button

        >
          <span>↪</span>
          <span>Logout</span>
        </button>

      </div>

        <div class="topbar-user">

          <div class="user-info">
            <strong>CAS Administrator</strong>
            <span>Administrator</span>
          </div>

        </div>

      </header>

      <!-- CONTENT -->
  <section class="content">

      <div class="welcome-section">

        <h2>Welcome to CAS Management System</h2>

        <p>

          obligations, and events in one place.
        </p>

      </div>

      <div class="dashboard-grid">

        </div>

      </div>


    </div>
  </section>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>

  <div id="successToast" class="success-toast">
  <div class="success-toast-icon">✓</div>

  <div class="success-toast-content">
    <strong id="successToastTitle">
      Student Added Successfully
    </strong>

    <span id="successToastMessage">
      The student has been added to the system.
    </span>
  </div>
