<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CAS Management System | Login</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="login-page">

    <div class="login-card">

      <div class="login-header">
        <h1>CAS</h1>

        <h2>Management System</h2>

        <p>
          Sign in to continue
        </p>
      </div>

      <form id="loginForm">

        <div class="form-group">

          <label for="username">
            Username
          </label>

          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            autocomplete="username"
            required
          >

        </div>

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          >

        </div>

        <button
          type="submit"
          class="primary-button login-button"
        >
          Sign In
        </button>

      </form>

    </div>

  </div>

  <script src="login.js"></script>
</body>

</html>
